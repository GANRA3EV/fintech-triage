[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fintech-triage"
version = "0.3.0"
description = "Подготовка обращений финтех-сервиса для оператора"
requires-python = ">=3.11,<3.15"
dependencies = ["pandas>=2.2,<4", "scikit-learn>=1.5,<2", "openpyxl>=3.1,<4", "joblib>=1.4,<2"]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3,<6"]
dev = ["pytest>=8,<10"]
local-hf = ["transformers>=4.57,<6", "torch>=2.6,<3"]

[tool.setuptools.packages.find]
include = ["triage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
