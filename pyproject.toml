[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fintech-triage"
version = "0.1.1"
description = "Подготовка обращений финтех-сервиса для оператора"
requires-python = ">=3.11,<3.15"
dependencies = ["pandas>=2.2,<4", "scikit-learn>=1.5,<2", "openpyxl>=3.1,<4", "pydantic>=2.9,<3", "httpx>=0.27,<1", "joblib>=1.4,<2"]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3,<6"]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["triage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
